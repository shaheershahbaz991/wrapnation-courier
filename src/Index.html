<title>Wrapnation Courier</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#eef1f5;--surf:#fff;--ink:#14202b;--mute:#66727f;--line:#dbe1e8;--hd:#0e1726;--acc:#0891b2;--accw:#fff;--soft:#e4e9ef;
 --New:#64748b;--Handed:#c77700;--Delivered:#16a34a;--Returned:#dc2626;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b121b;--surf:#152030;--ink:#e8edf3;--mute:#93a1b1;--line:#27364a;--hd:#060b12;--acc:#22c3e6;--accw:#04222b;--soft:#1e2c40;--New:#8392a6;--Handed:#f0a63a;--Delivered:#3ddc84;--Returned:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b121b;--surf:#152030;--ink:#e8edf3;--mute:#93a1b1;--line:#27364a;--hd:#060b12;--acc:#22c3e6;--accw:#04222b;--soft:#1e2c40;--New:#8392a6;--Handed:#f0a63a;--Delivered:#3ddc84;--Returned:#ff6b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
.wrap{max-width:720px;margin:0 auto}
header{background:var(--hd);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.hin{max-width:720px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);color:var(--accw);display:grid;place-items:center;font-size:18px}
.ttl{flex:1;line-height:1.15}.ttl b{font-size:17px;display:block}.ttl small{color:#9db0c4;font-size:12px}
button{font:inherit;border:0;cursor:pointer;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hb{background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:9px 12px;font-size:14px}
.hb.p{background:var(--acc);color:var(--accw);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 12px 4px}
.st{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 11px}
.st span{display:block;font-size:12px;color:var(--mute)}.st b{display:block;font-size:19px;margin-top:2px}.st i{font-style:normal;font-size:11.5px;color:var(--mute)}
.st.net{background:var(--acc);border-color:var(--acc);color:var(--accw)}.st.net span,.st.net i{color:inherit;opacity:.8}
.q{padding:8px 12px 0}
.q input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--soft);border-radius:999px;padding:8px 13px;font-size:14px;color:var(--ink)}
.tab em{font-style:normal;color:var(--mute);margin-left:5px;font-size:12.5px}
.tab.on{background:var(--ink);color:var(--bg)}.tab.on em{color:inherit;opacity:.7}
.card{background:var(--surf);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;margin:0 12px 9px;overflow:hidden}
.card.New{--c:var(--New)}.card.Handed{--c:var(--Handed)}.card.Delivered{--c:var(--Delivered)}.card.Returned{--c:var(--Returned)}
.hd{width:100%;background:none;text-align:left;padding:12px 13px;display:flex;gap:10px;align-items:flex-start}
.l{flex:1;min-width:0}.no{font-weight:700;font-size:15.5px}
.nm,.sub{font-size:13.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.r{text-align:right}.amt{font-weight:700;font-size:16px}
.pill{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.bd{padding:0 13px 13px;border-top:1px dashed var(--line)}
.bd[hidden]{display:none}
.info{font-size:13.5px;line-height:1.45;margin:11px 0 4px}.info a{color:var(--acc);margin-right:12px;font-weight:600;text-decoration:none}
.info .m{color:var(--mute)}
label{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 4px}
.in{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.seg button{background:var(--soft);border-radius:10px;padding:10px 2px;font-size:12px}
.seg button.on{background:var(--c2);color:#fff;font-weight:700}
.seg button[data-v=New]{--c2:var(--New)}.seg button[data-v="Handed over"]{--c2:var(--Handed)}.seg button[data-v=Delivered]{--c2:var(--Delivered)}.seg button[data-v=Returned]{--c2:var(--Returned)}
.net{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--soft);font-size:14px}
.save{width:100%;margin-top:13px;padding:13px;border-radius:12px;background:var(--acc);color:var(--accw);font-weight:700;font-size:15.5px}
.link{background:none;color:var(--acc);padding:0;text-decoration:underline;font-size:13.5px}
.empty{padding:34px 20px;text-align:center;color:var(--mute);line-height:1.5}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
#msg{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;display:none;max-width:90%;text-align:center;z-index:20;font-size:14px}
.lab{width:100mm;height:150mm;background:#fff;color:#000;display:flex;flex-direction:column;overflow:hidden;font-family:Inter,"Helvetica Neue",Arial,sans-serif;text-align:left;margin:0 auto;break-after:page;page-break-after:always}
.lab .top{display:flex;align-items:center;padding:12px 14px 10px;gap:10px}.lab .top img{height:24px}.lab .wm{flex:1;font-size:15px;font-weight:800;letter-spacing:4px}
.lab .meta{text-align:right;font-size:8.5px;color:#555;line-height:1.5}.lab .meta b{color:#000}
.lab .rule{height:4px;background:#ff7a00}.lab .hero{display:grid;grid-template-columns:1fr 1.15fr;border-bottom:2px solid #000}
.lab .city{background:#000;color:#fff;padding:8px 14px}.lab small{display:block;font-size:8px;letter-spacing:2px;font-weight:600}.lab .city small{opacity:.75}
.lab .city b{display:block;font-size:46px;font-weight:900;letter-spacing:-1px;line-height:1.05}
.lab .pay{padding:8px 14px;display:flex;flex-direction:column;justify-content:center}.lab .pay small{color:#444}.lab .pay b{font-size:27px;font-weight:900;line-height:1.1}.lab .pay span{font-size:9px;font-weight:700;letter-spacing:1.5px;margin-top:2px}
.lab .to{padding:11px 14px;display:flex;gap:10px;flex:1;border-bottom:2px solid #000;min-height:0}.lab .tx{flex:1}.lab .lbl{font-size:8px;letter-spacing:2px;font-weight:700;color:#555;margin-bottom:5px}
.lab .nm{font-size:21px;font-weight:800;line-height:1.1}.lab .ad{font-size:12.5px;line-height:1.4;margin-top:6px}.lab .ph{font-size:14px;font-weight:700;margin-top:8px}
.lab .qr{width:70px;height:70px;flex:none}.lab .qr img,.lab .qr canvas{width:70px!important;height:70px!important}
.lab .fr{padding:6px 14px;font-size:9.5px;border-bottom:1px solid #000;line-height:1.35}.lab .fr b{font-size:8px;letter-spacing:2px;color:#555;margin-right:5px}
.lab .gr{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #000}.lab .gr div{padding:6px 10px 6px 14px;border-right:1px solid #000;font-size:12px;font-weight:700}.lab .gr div:last-child{border:0}.lab .gr small{font-size:7.5px;color:#555;margin-bottom:1px}
.lab .rm{padding:6px 14px;font-size:10.5px;min-height:34px;border-bottom:2px solid #000}.lab .rm small{color:#555;font-size:7.5px}
.lab .bc{display:flex;justify-content:center;padding:8px 10px 4px}.lab .ft{background:#000;color:#fff;font-size:8.5px;letter-spacing:2px;font-weight:600;text-align:center;padding:6px 0;margin-top:auto}.lab .ft em{font-style:normal;color:#ff7a00}
#printArea{display:none}
#setp{display:none;background:var(--surf);border:1px solid var(--line);border-radius:14px;margin:10px 12px;padding:6px 13px 13px}
@media print{@page{size:100mm 150mm;margin:0}body>*{display:none!important}body::before{display:none!important}body>#printArea{display:block!important}.lab{margin:0}}
@media (prefers-reduced-motion:no-preference){.bd{animation:o .15s ease-out}@keyframes o{from{opacity:0}to{opacity:1}}}
</style></head>

<script>
const STAT=['New','Handed over','Delivered','Returned'];
const cls=s=>String(s||'New').split(' ')[0];
let orders={}, filt='All', open=new Set(), inbox=[], inboxLoaded=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chg=o=>o.charge!=null&&o.charge!==''?Number(o.charge):250;
const rs=n=>'Rs '+Number(n||0).toLocaleString('en-US');
function toast(t,ms){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',ms||3000)}
function load(){google.script.run.withSuccessHandler(a=>{orders={};a.forEach(o=>orders[o.id]=o);render()}).withFailureHandler(e=>{$('list').innerHTML='<div class="empty"><b>Data load nahi hua</b>'+esc(e.message)+'</div>'}).getOrders()}
function setTab(s){filt=s;render()}
function toggle(id){open.has(id)?open.delete(id):open.add(id);render()}
function pick(id,v){
 const g=$('st'+id);g.dataset.v=v;g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 $('dl'+id).hidden=v!=='Delivered';calcNet(id);
}
function calcNet(id){
 const a=Number($('am'+id).value)||0,c=Number($('ch'+id).value)||0;
 $('nt2'+id).textContent='Net: '+rs(a)+' − '+rs(c)+' = '+rs(a-c);
}
function render(){
 const q=$('q').value.toLowerCase();
 const all=Object.values(orders).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
 const sum=(st,f)=>all.filter(o=>o.status===st).reduce((s,o)=>s+f(o),0);
 const pend=sum('Handed over',o=>Number(o.cod||0)),got=sum('Delivered',o=>Number(o.delivered||0)),ch=sum('Delivered',chg);
 $('stats').innerHTML='<div class="st"><span>Courier ke paas</span><b>'+rs(pend)+'</b><i>COD baqi</i></div><div class="st"><span>Mila</span><b>'+rs(got)+'</b><i>Delivered</i></div><div class="st net"><span>Net</span><b>'+rs(got-ch)+'</b><i>charges '+rs(ch)+'</i></div>';
 $('tabs').innerHTML=['Inbox','All'].concat(STAT).map(s=>'<button class="tab'+(s===filt?' on':'')+'" onclick="setTab(\''+s+'\')">'+s+'<em>'+(s==='Inbox'?(inboxLoaded?inbox.length:''):s==='All'?all.length:all.filter(o=>o.status===s).length)+'</em></button>').join('');
 if(filt==='Inbox'){renderInbox();return}
 if(!all.length){$('list').innerHTML='<div class="empty"><b>Abhi koi order nahi</b>"Shopify sync" dabayen, Inbox mein jo orders local courier se bhejne hain unhe chunen.</div>';return}
 const list=all.filter(o=>(filt==='All'||o.status===filt)&&[o.no,o.name,o.phone,o.city,o.courier].join(' ').toLowerCase().includes(q));
 $('list').innerHTML=list.map(o=>{
  const id=o.id,isOpen=open.has(id);
  const d=o.createdAt?new Date(o.createdAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):'';
  const ph=String(o.phone||'').replace(/[^0-9]/g,'');
  const addr=o.address?esc(o.address)+(o.city?', '+esc(o.city):''):(o.city?esc(o.city)+' ':'')+'';
  const amtShown=o.status==='Delivered'?Number(o.delivered||0):Number(o.cod||0);
  const st=o.status||'New';
  const dv=o.delivered!==''&&o.delivered!=null?o.delivered:o.cod;
  return `<div class="card ${esc(cls(st))}">
  <button class="hd" onclick="toggle('${id}')"><div class="l"><div class="no">${esc(o.no)}</div><div class="nm">${esc(o.name)}${o.city?', '+esc(o.city):''}</div><div class="sub">${esc(d)}${o.courier?' | '+esc(o.courier):''}</div></div>
  <div class="r"><div class="amt">${rs(amtShown)}</div><span class="pill">${esc(st)}</span></div></button>
  <div class="bd" ${isOpen?'':'hidden'}>
   <div class="info"><div>${addr||'<span class="m">Address nahi hai</span>'}</div>${o.items?'<div class="m">'+esc(o.items)+'</div>':''}<div class="m">Order total ${rs(o.total)}, COD ${rs(o.cod)}</div>${ph?'<div style="margin-top:6px"><a href="tel:'+ph+'">Call</a><a href="https://wa.me/'+ph+'" target="_blank" rel="noopener">WhatsApp</a></div>':''}</div>
   <label>Status</label>
   <div class="seg" id="st${id}" data-v="${esc(st)}">${STAT.map(s=>'<button data-v="'+s+'" class="'+(s===st?'on':'')+'" onclick="pick(\''+id+'\',\''+s+'\')">'+s+'</button>').join('')}</div>
   <div class="two"><div><label>Courier</label><input class="in" id="co${id}" placeholder="Naam" value="${esc(o.courier)}"></div><div><label>Phone</label><input class="in" id="ph${id}" inputmode="tel" placeholder="03xx" value="${esc(o.phone)}"></div></div>
   <div id="dl${id}" ${st==='Delivered'?'':'hidden'}><div class="two"><div><label>Amount mila (Rs)</label><input class="in" id="am${id}" type="number" inputmode="numeric" value="${esc(dv)}" oninput="calcNet('${id}')"></div><div><label>Courier charge (Rs)</label><input class="in" id="ch${id}" type="number" inputmode="numeric" value="${chg(o)}" oninput="calcNet('${id}')"></div></div><div class="net" id="nt2${id}">Net: ${rs(Number(dv||0)-chg(o))}</div></div>
   <label>Note</label><input class="in" id="nt${id}" placeholder="Optional" value="${esc(o.note)}">
   <button class="save" onclick="save('${id}')">Save changes</button><button class="save" style="background:var(--soft);color:var(--ink)" onclick="printOne('${id}')">🏷 Print label</button><button class="save" id="gv${id}" style="background:#16a34a;color:#fff" onclick="giveOne('${id}')">🚚 Courier ko diya (Shopify fulfill)</button>
  </div></div>`}).join('')||'<div class="empty"><b>Kuch nahi mila</b>Search ya status tab badal kar dekhein.</div>';
 open.forEach(id=>{if(orders[id]&&!$('am'+id)===false)calcNet(id)});
}
function save(id){
 const g=k=>($(k+id)||{value:''}).value.trim(), status=$('st'+id).dataset.v;
 const d={courier:g('co'),status,note:g('nt'),phone:g('ph'),amount:g('am'),charge:g('ch')===''?chg(orders[id]||{}):Number(g('ch'))};
 toast('Saving…',10000);
 google.script.run.withSuccessHandler(r=>{open.delete(id);toast('Saved ✅'+(r&&r.shopify?' | '+r.shopify:''),r&&r.shopify?8000:1800);load()}).withFailureHandler(e=>toast('Save nahi hua: '+e.message,4500)).updateOrder(id,d);
}
function sync(){
 const b=$('syncBtn');b.disabled=true;toast('Shopify se orders aa rahe hain…',30000);
 google.script.run.withSuccessHandler(a=>{b.disabled=false;inbox=a;inboxLoaded=true;filt='Inbox';toast(a.length+' orders Inbox mein',2500);render()}).withFailureHandler(e=>{b.disabled=false;toast(e.message,5000)}).getInbox();
}
function renderInbox(){
 const q=$('q').value.toLowerCase();
 if(!inboxLoaded){$('list').innerHTML='<div class="empty"><b>Shopify orders abhi nahi laye</b>Upar "Shopify sync" dabayen.</div>';return}
 const list=inbox.filter(o=>[o.no,o.name,o.city].join(' ').toLowerCase().includes(q));
 if(!list.length){$('list').innerHTML='<div class="empty"><b>Inbox khali hai</b>Koi naya order nahi.</div>';return}
 $('list').innerHTML=list.map(o=>`<div class="card New"><div class="hd" style="cursor:default"><div class="l"><div class="no">${esc(o.no)}</div><div class="nm">${esc(o.name)}${o.city?', '+esc(o.city):''}</div><div class="sub">${esc(o.items)}</div></div><div class="r"><div class="amt">${rs(o.cod)}</div><span class="pill">COD</span></div></div>
 <div class="bd" style="display:flex;gap:8px;padding-top:11px"><button class="save" style="margin:0" onclick="addOne('${o.id}')">Local courier</button><button class="save" style="margin:0;background:var(--soft);color:var(--ink)" onclick="skipOne('${o.id}')">PostEx / Skip</button></div></div>`).join('');
}
function addOne(id){
 const o=inbox.find(x=>x.id===id);if(!o)return;toast('Add ho raha hai…',10000);
 google.script.run.withSuccessHandler(()=>{inbox=inbox.filter(x=>x.id!==id);toast('Local courier list mein add ✅',2000);load()}).withFailureHandler(e=>toast(e.message,4500)).addOrders([o]);
}
function skipOne(id){
 google.script.run.withSuccessHandler(()=>{inbox=inbox.filter(x=>x.id!==id);toast('Inbox se hata diya',1800);render()}).withFailureHandler(e=>toast(e.message,4500)).skipOrders([id]);
}
function openSheet(){google.script.run.withSuccessHandler(u=>window.open(u,'_blank')).getSheetUrl()}
let LS={name:'Wrapnation',addr:'Shop no.4, 18c, Stadium Lane 4, Defence Khadda Market, DHA Phase 5, Karachi',phone:'0336-1010065',weight:'0.5',prefix:'WN',remarks:'Must Call Consignee before Delivering the Parcel.',notify:false};
const LOGO=document.querySelector(".logo img").src;
google.script.run.withSuccessHandler(s=>{if(s)LS=Object.assign(LS,s)}).getLabelSettings();
function toggleSet(){const p=$('setp');if(p.style.display==='block'){p.style.display='none';return}
 $('sN').value=LS.name;$('sA').value=LS.addr;$('sT').value=LS.phone;$('sW').value=LS.weight;$('sP').value=LS.prefix;$('sR').value=LS.remarks;$('sNo').checked=!!LS.notify;p.style.display='block'}
function saveSet(){LS={name:$('sN').value.trim(),addr:$('sA').value.trim(),phone:$('sT').value.trim(),weight:$('sW').value.trim(),prefix:$('sP').value.trim(),remarks:$('sR').value.trim(),notify:$('sNo').checked};
 google.script.run.withSuccessHandler(()=>{toast('Settings save ✅',1800);$('setp').style.display='none'}).withFailureHandler(e=>toast(e.message,4000)).saveLabelSettings(LS)}
function cityCode(c){const m={karachi:'KHI',lahore:'LHE',islamabad:'ISB',rawalpindi:'RWP',peshawar:'PEW',faisalabad:'FSD',multan:'MUX',quetta:'UET',hyderabad:'HYD',sialkot:'SKT',gujranwala:'GRW'};const k=String(c||'').trim().toLowerCase();return m[k]||k.slice(0,3).toUpperCase()||'---'}
function pieces(items){let n=0;String(items||'').replace(/(\d+)\s*x/g,(a,b)=>{n+=Number(b)});return n||1}
function trkOf(o){return(LS.prefix||'')+String(o.no).replace(/[^A-Za-z0-9]/g,'')}
function labelHtml(o){
 const cod=Number(o.cod)||0,dt=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase();
 return `<div class="lab"><div class="top"><img alt="" src="${LOGO}"><div class="wm">WRAPNATION</div><div class="meta">ORDER <b>${esc(o.no)}</b><br>${dt}</div></div><div class="rule"></div>
 <div class="hero"><div class="city"><small>DESTINATION</small><b>${esc(cityCode(o.city))}</b></div><div class="pay"><small>${cod?'COLLECT ON DELIVERY':'PAYMENT'}</small><b>${cod?rs(cod):'PREPAID'}</b><span>${cod?'CASH ON DELIVERY':'NO CASH TO COLLECT'}</span></div></div>
 <div class="to"><div class="tx"><div class="lbl">DELIVER TO</div><div class="nm">${esc(o.name)}</div><div class="ad">${esc(o.address)}<br><b>${esc(String(o.city||'').toUpperCase())}, PAKISTAN</b></div><div class="ph">${esc(o.phone)}</div></div><div class="qr" data-v="${esc(trkOf(o))}"></div></div>
 <div class="fr"><b>FROM</b>${esc(LS.name)} · ${esc(LS.addr)} · ${esc(LS.phone)}</div>
 <div class="gr"><div><small>WEIGHT</small>${esc(LS.weight)} KG</div><div><small>PIECES</small>${pieces(o.items)}</div><div><small>ORDER ID</small>${esc(o.no)}</div></div>
 <div class="rm"><small>REMARKS</small><b>${esc(LS.remarks)}</b>${o.note?'<br>'+esc(o.note):''}</div>
 <div class="bc"><svg data-v="${esc(trkOf(o))}"></svg></div><div class="ft">THANK YOU FOR SHOPPING WITH <em>WRAPNATION</em></div></div>`}
function printList(list){
 if(!list.length){toast('Print karne ke liye koi order nahi',2500);return}
 const pa=$('printArea');pa.innerHTML=list.map(labelHtml).join('');
 pa.querySelectorAll('svg').forEach(s=>{try{JsBarcode(s,s.dataset.v,{format:'CODE128',height:44,fontSize:12,margin:0,width:2,textMargin:3})}catch(e){}});
 pa.querySelectorAll('.qr').forEach(q=>{try{new QRCode(q,{text:q.dataset.v,width:140,height:140,correctLevel:QRCode.CorrectLevel.M})}catch(e){}});
 setTimeout(()=>window.print(),300)}
let gv={};
function giveOne(id){const o=orders[id];if(!o)return;const b=$('gv'+id);
 if(!gv[id]){gv[id]=1;b.textContent='Pakka? Dobara dabayein';setTimeout(()=>{delete gv[id];const x=$('gv'+id);if(x)x.textContent="🚚 Courier ko diya (Shopify fulfill)"},4000);return}
 delete gv[id];toast('Shopify par fulfill ho raha hai…',20000);
 google.script.run.withSuccessHandler(r=>{toast(r.msg,3500);load()}).withFailureHandler(e=>toast(e.message,7000)).fulfillOrder(id,trkOf(o),!!LS.notify)}
function printOne(id){if(orders[id])printList([orders[id]])}
function printAll(){
 const q=$('q').value.toLowerCase();
 if(filt==='Inbox'){toast('Pehle orders "Local courier" mein add karein, phir label nikalein',3500);return}
 const list=Object.values(orders).filter(o=>(filt==='All'||o.status===filt)&&[o.no,o.name,o.phone,o.city,o.courier].join(' ').toLowerCase().includes(q));
 if(list.length>20&&!confirm(list.length+' labels print honge. Theek hai?'))return;
 printList(list)}
load();
</script></body></html>
